openapi: 3.0.3
info:
  title: SimuFax API
  version: "1.0"
  description: |
    通过 HTTPS 上传文件并查询传真任务状态。
    需要传真站管理员发放的 Bearer 密钥。
servers:
  - url: https://fax.verstappen.uk
tags:
  - name: fax
    description: 传真投递与状态
  - name: system
    description: 服务状态
security:
  - bearerAuth: []
paths:
  /api/v1/fax:
    post:
      tags: [fax]
      summary: 发送一封传真
      description: 以 multipart/form-data 上传文件。
      parameters:
        - name: X-SimuFax-Sender
          in: header
          required: false
          description: 发件人；也可以使用表单字段 sender。
          schema:
            type: string
        - name: X-SimuFax-Recipient
          in: header
          required: false
          schema:
            type: string
        - name: X-SimuFax-Subject
          in: header
          required: false
          schema:
            type: string
        - name: X-SimuFax-Message-Id
          in: header
          required: false
          description: 幂等编号。
          schema:
            type: string
        - name: X-SimuFax-Sha256
          in: header
          required: false
          description: 原始文件的 SHA-256。
          schema:
            type: string
            pattern: '^[A-Fa-f0-9]{64}$'
        - name: X-SimuFax-Pages
          in: header
          required: false
          schema:
            type: integer
            minimum: 1
        - name: X-SimuFax-Timestamp
          in: header
          required: false
          schema:
            type: string
        - name: X-SimuFax-Client-IP
          in: header
          required: false
          description: 发送端声明的 IP，仅记录。
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF、PNG、JPEG、TIFF 或 TXT。
                sender:
                  type: string
                  maxLength: 120
                  description: 自由文本，可省略。
                recipient:
                  type: string
                  maxLength: 120
                subject:
                  type: string
                  maxLength: 200
                message:
                  type: string
                  maxLength: 2000
                message_id:
                  type: string
                  maxLength: 200
                client_ip:
                  type: string
                  maxLength: 80
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "202":
          description: 已接收
          headers:
            Location:
              schema:
                type: string
              description: 状态查询地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaxAccepted"
              example:
                ok: true
                id: F20261103-A1B2C3D4E5
                status: pending
                pages: 3
                checksum: a1b2c3d4e5f6
                duplicate: false
                received_at: "2026-11-03T11:30:00+00:00"
        "200":
          description: 幂等编号已存在，返回原任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaxAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidDocument"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/fax/{id}:
    get:
      tags: [fax]
      summary: 查询传真状态
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaxStatus"
              example:
                ok: true
                id: F20261103-A1B2C3D4E5
                status: pending
                pages: 3
                received_at: "2026-11-03T11:30:00+00:00"
                updated_at: "2026-11-03T11:30:00+00:00"
                error: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/health:
    get:
      tags: [system]
      summary: 健康检查
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  protocol:
                    type: string
                  time:
                    type: string
              example:
                ok: true
                service: simufax-receiver
                protocol: simufax-http/1
                time: "2026-11-03T11:30:00+00:00"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SFX key
  schemas:
    FaxAccepted:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
        status:
          type: string
          enum: [pending, printing, printed, rejected, failed]
        pages:
          type: integer
        checksum:
          type: string
        duplicate:
          type: boolean
        received_at:
          type: string
    FaxStatus:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
        status:
          type: string
          enum: [pending, printing, printed, rejected, failed]
        pages:
          type: integer
        received_at:
          type: string
        updated_at:
          type: string
        error:
          type: string
          nullable: true
    Error:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 缺少或无效的密钥
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 幂等编号冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: 请求体过大
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Content-Type 不受支持
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidDocument:
      description: 文件不符合要求
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: 请求频率过高
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: 服务暂时不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
